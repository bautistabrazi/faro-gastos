<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Faro · Control de gastos. Registro de consumos, cuotas y gastos fijos, con proyección mes a mes." />
  <meta name="theme-color" content="#F6F7FB" />
  <link rel="icon" href="assets/icono.svg" type="image/svg+xml" />
  <!-- Ícono para "Agregar a la pantalla de inicio" en iPhone (iOS ignora el
       manifest para esto). Cuadrado a sangre completa: iOS le pone sus
       propias esquinas redondeadas encima. -->
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <!-- Que Safari muestre la app instalada sin la barra del navegador. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Faro" />
  <title>Faro · Control de gastos</title>

  <!-- Manifest + service worker: hacen que la app se pueda instalar y ande
       offline (ver js/registro-sw.js y sw.js). -->
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Corre ANTES de pintar la página, para que no haya "parpadeo" de color
       al abrir la app. Está en un archivo aparte (no inline) para poder tener
       un Content-Security-Policy estricto sin 'unsafe-inline' en script-src
       (ver vercel.json). -->
  <script src="js/tema-inicial.js?v=16"></script>

  <!-- Tipografía (Google Fonts): solo Inter, para títulos, texto y montos
       (los montos usan cifras tabulares, ver .monto en base.css). Si no hay
       internet, se usa la de respaldo definida en base.css y la app anda igual. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos propios. ORDEN IMPORTA: base -> componentes -> layout.
       El "?v=16" es un truco para forzar al navegador a recargar el CSS/JS
       cuando lo editamos (subir el número). -->
  <link rel="stylesheet" href="css/base.css?v=16" />
  <link rel="stylesheet" href="css/componentes.css?v=16" />
  <link rel="stylesheet" href="css/layout.css?v=16" />
</head>

<body>
  <div class="app">
    <!-- ============================ CABECERA ============================ -->
    <header class="cabecera">
      <div class="cabecera__interior">
        <div class="cabecera__marca">
          <!-- Isotipo: cuadrado índigo con un "punto de luz" (el faro). Es
               decorativo, por eso aria-hidden. Está dibujado con CSS. -->
          <span class="marca__iso" aria-hidden="true"></span>
          Faro <span class="cabecera__sub">Control de gastos</span>
        </div>

        <div class="cabecera__acciones">
          <!-- Navegación. Cada botón lleva data-pantalla con el nombre de la
               vista que abre. app.js escucha los clics acá.
               En la compu se ve solo el texto; en el celular la barra flota
               abajo y muestra el ícono arriba del texto (ver layout.css). -->
          <nav class="nav" id="nav" aria-label="Secciones">
            <button class="nav__item" data-pantalla="gastos" type="button">
              <span class="nav__icono" aria-hidden="true">
                <!-- ícono "lista" -->
                <svg class="icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg>
              </span>
              <span class="nav__texto">Gastos</span>
            </button>
            <button class="nav__item" data-pantalla="ingresos" type="button">
              <span class="nav__icono" aria-hidden="true">
                <!-- ícono "flecha arriba en círculo" -->
                <svg class="icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4"/><path d="M12 16V8"/></svg>
              </span>
              <span class="nav__texto">Ingresos</span>
            </button>
            <button class="nav__item" data-pantalla="proyeccion" type="button">
              <span class="nav__icono" aria-hidden="true">
                <!-- ícono "tendencia" -->
                <svg class="icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>
              </span>
              <span class="nav__texto">Proyección</span>
            </button>
            <button class="nav__item" data-pantalla="ajustes" type="button">
              <span class="nav__icono" aria-hidden="true">
                <!-- ícono "engranaje" -->
                <svg class="icono" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
              <span class="nav__texto">Ajustes</span>
            </button>
          </nav>

          <!-- Interruptor rápido de tema (claro / oscuro). El control completo,
               con la opción "Automático", está en Ajustes. app.js lo maneja y
               le dibuja adentro el ícono de sol o luna (SVG). -->
          <button class="tema-toggle" id="tema-toggle" type="button"
                  aria-label="Cambiar entre tema claro y oscuro" title="Tema claro / oscuro"></button>
        </div>
      </div>
    </header>

    <!-- ============================ CONTENIDO ===========================
         Acá adentro, cada archivo vista-*.js dibuja su pantalla. Empieza
         vacío; app.js lo llena al arrancar. -->
    <main class="contenido" id="contenido" aria-live="polite"></main>
  </div>

  <!-- Aviso flotante reutilizable ("Gasto agregado", etc.). Oculto hasta que
       app.js lo necesita. -->
  <div class="aviso" id="aviso" role="status" hidden></div>

  <!-- ============================ SCRIPTS ==============================
       ORDEN IMPORTA. De abajo hacia arriba en dependencias:
         tema-inicial (en <head>, ya cargado)-> evita el parpadeo de color
         config                              -> claves de Supabase (o vacío)
         supabase-js (js/vendor)             -> cliente de Supabase (opcional)
         formato + nucleo + almacenamiento   -> lógica, no dependen de nadie
         iconos                              -> los íconos SVG que usan las vistas
         tema                                -> maneja claro/oscuro
         nube                                -> sincronización opcional
         vista-*                             -> dibujan cada pantalla
         app                                 -> une todo y arranca
         registro-sw                         -> instala el Service Worker (PWA/offline)
  -->
  <script src="js/config.js?v=16"></script>
  <!-- Cliente de Supabase (expone window.supabase.createClient). Alojado en
       el propio proyecto (ver js/vendor/supabase.js) en vez de por CDN: nos
       pasó que cargarlo desde jsdelivr fallaba de forma intermitente, y es
       una pieza crítica (sin esto no hay login ni sincronización). Si por lo
       que sea no llegara a cargar, la app igual funciona en modo local. -->
  <script src="js/vendor/supabase.js?v=16"></script>

  <script src="js/formato.js?v=16"></script>
  <script src="js/nucleo.js?v=16"></script>
  <script src="js/almacenamiento.js?v=16"></script>
  <script src="js/iconos.js?v=16"></script>
  <script src="js/tema.js?v=16"></script>
  <script src="js/nube.js?v=16"></script>
  <script src="js/vista-gastos.js?v=16"></script>
  <script src="js/vista-ingresos.js?v=16"></script>
  <script src="js/vista-proyeccion.js?v=16"></script>
  <script src="js/vista-ajustes.js?v=16"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/registro-sw.js?v=16"></script>
</body>
</html>
